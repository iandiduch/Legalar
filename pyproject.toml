[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-intelligence-universitario"
version = "1.0.0"
description = "Sistema de IA para gestión de consultas institucionales y académicas universitarias con Multi-Agent LangGraph, RAG y HOTL."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.50.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "psycopg[binary,pool]>=3.2.0",
    "redis>=5.2.0",
    "pinecone>=5.3.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "python-json-logger>=3.0.0",
    "arize-phoenix-otel>=0.8.0",
    "openinference-instrumentation-langchain>=0.1.20",
    "openinference-instrumentation-openai>=0.1.15",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "BLE",  # flake8-blind-except
]
ignore = [
    "B008",   # Do not perform function call in argument defaults (usado por Depends() en FastAPI)
    "UP007",  # Use X | Y for type annotations
    "UP042",  # Inherit from StrEnum (mantenemos str, Enum para compatibilidad de serialización Pydantic)
    "UP047",  # Generic function syntax (usamos TypeVar para compatibilidad completa)
    "E501",   # Line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
